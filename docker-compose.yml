version: '3.8'

services:
  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: ./ga-solver-simple/backend/Dockerfile
    ports:
      - "8000:8000"
    # volumes:
    #   - ./ga-solver-simple/backend:/app
    #   - /app/ga_solver
    # volumnes:
    #   - ./ga-solver-simple/backend:/app
    depends_on:
      - redis
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - GA_SOLVER_EXECUTABLE_PATH=/app/ga_solver
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: .
      dockerfile: ./ga-solver-simple/backend/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - GA_SOLVER_EXECUTABLE_PATH=/app/ga_solver
    command: celery -A celery_worker.celery_app worker --loglevel=info

volumes:
  redis_data: 